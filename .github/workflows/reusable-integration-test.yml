name: Reusable workflow integration test

# Run after changes reach main, and verify the published reusable workflow.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  call-reusable-lab:
    uses: omar-priv/smoothflow-android./.github/workflows/universal-lab.yml@main
    with:
      timeout: 120
      auto_repair: false
