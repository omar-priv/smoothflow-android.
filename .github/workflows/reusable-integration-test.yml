name: Reusable workflow integration test

on:
  push:
    branches:
      - "feat/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  call-reusable-lab:
    uses: omar-priv/smoothflow-android./.github/workflows/universal-lab.yml@feat/ai-assisted-repair
    with:
      timeout: 120
      auto_repair: false
