name: Universal Code Lab (reusable)

on:
  workflow_call:
    inputs:
      timeout:
        required: false
        default: 300
        type: number
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Checkout lab tools
        uses: actions/checkout@v4
        with:
          repository: omar-priv/smoothflow-android.
          ref: main
          path: .universal-code-lab
      - name: Set up Node when package manifest exists
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install npm dependencies when lockfile exists
        if: hashFiles('package-lock.json') != ''
        run: npm ci
      - name: Set up Go when go.mod exists
        if: hashFiles('go.mod') != ''
        uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install Python requirements when present
        if: hashFiles('requirements.txt') != ''
        run: python -m pip install -r requirements.txt
      - name: Run lab
        id: lab
        continue-on-error: true
        run: python .universal-code-lab/tools/lab.py --root . --output universal-code-lab-report --timeout ${{ inputs.timeout || 300 }}
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universal-code-lab-report
          path: universal-code-lab-report/
          if-no-files-found: warn
          retention-days: 14
      - name: Fail if checks failed
        if: steps.lab.outcome == 'failure'
        run: exit 1
